<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced QR & Password Generator</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0d0714">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #0d0714; color: #ffffff; }
        .glass-card { background: rgba(20, 14, 30, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(147, 51, 234, 0.2); box-shadow: 0 0 30px rgba(147, 51, 234, 0.15); }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between items-center p-4">

    <div class="w-full max-w-md flex justify-between items-center py-4">
        <h1 class="text-xl font-bold tracking-wider bg-gradient-to-r from-purple-400 to-pink-500 bg-clip-text text-transparent">Pro Multi-Tools</h1>
        <button id="installBtn" class="hidden bg-purple-600/20 text-purple-300 border border-purple-500/30 px-3 py-1.5 rounded-full text-xs font-semibold flex items-center gap-1">📱 Install App</button>
    </div>

    <div class="w-full max-w-md glass-card rounded-2xl p-6 text-center my-auto">
        <h2 class="text-2xl font-bold text-purple-400 mb-1">CUSTOM GENERATOR</h2>
        <p class="text-gray-400 text-sm mb-6">Create Custom QR & Secure Passwords</p>

        <div class="flex bg-black/40 p-1 rounded-xl mb-6 border border-purple-900/30">
            <button onclick="switchTab('qr')" id="qrTabBtn" class="flex-1 py-2 text-sm font-medium rounded-lg bg-purple-600 text-white transition">QR Code</button>
            <button onclick="switchTab('pwd')" id="pwdTabBtn" class="flex-1 py-2 text-sm font-medium rounded-lg text-gray-400 transition">Password</button>
        </div>

        <div id="qrSection" class="space-y-4 text-left">
            <div>
                <label class="text-xs text-gray-400 mb-1 block">Text or URL:</label>
                <input type="text" id="qrInput" placeholder="Enter text or URL..." class="w-full bg-black/50 border border-purple-900/40 rounded-xl px-4 py-2.5 text-white text-sm focus:outline-none focus:border-purple-500">
            </div>
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="text-xs text-gray-400 mb-1 block">QR Color:</label>
                    <input type="color" id="qrColor" value="#9333ea" class="w-full h-10 bg-black/50 border border-purple-900/40 rounded-xl cursor-pointer p-1">
                </div>
                <div>
                    <label class="text-xs text-gray-400 mb-1 block">Background Color:</label>
                    <input type="color" id="qrBgColor" value="#ffffff" class="w-full h-10 bg-black/50 border border-purple-900/40 rounded-xl cursor-pointer p-1">
                </div>
            </div>
            <div>
                <label class="text-xs text-gray-400 mb-1 block">Upload Logo Image (Optional):</label>
                <input type="file" id="qrLogo" accept="image/*" class="w-full text-xs text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:bg-purple-600 file:text-white cursor-pointer">
            </div>
            <button onclick="generateCustomQR()" class="w-full py-3 bg-gradient-to-r from-purple-600 to-pink-600 font-semibold rounded-xl text-white text-sm shadow-lg shadow-purple-600/30">Generate Custom QR</button>
            <div id="qrcode" class="flex justify-center mt-4 p-4 bg-white rounded-xl hidden"></div>
        </div>

        <div id="pwdSection" class="space-y-4 hidden">
            <div class="flex gap-2">
                <input type="text" id="pwdOutput" readonly placeholder="Generated password..." class="w-full bg-black/50 border border-purple-900/40 rounded-xl px-4 py-3 text-purple-300 font-mono text-sm focus:outline-none">
                <button onclick="copyPassword()" class="bg-purple-900/40 border border-purple-800/40 px-4 rounded-xl">📋</button>
            </div>
            <button onclick="generatePassword()" class="w-full py-3 bg-gradient-to-r from-purple-600 to-pink-600 font-semibold rounded-xl text-white text-sm shadow-lg shadow-purple-600/30">Generate Password</button>
        </div>
    </div>

    <footer class="text-gray-500 text-xs py-4">© Powered by Dilshan</footer>

    <script>
        let deferredPrompt;
        const installBtn = document.getElementById('installBtn');
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.classList.remove('hidden');
            installBtn.addEventListener('click', () => {
                installBtn.classList.add('hidden');
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then(() => { deferredPrompt = null; });
            });
        });

        function switchTab(tab) {
            const qrSec = document.getElementById('qrSection');
            const pwdSec = document.getElementById('pwdSection');
            const qrBtn = document.getElementById('qrTabBtn');
            const pwdBtn = document.getElementById('pwdTabBtn');
            if(tab === 'qr') {
                qrSec.classList.remove('hidden'); pwdSec.classList.add('hidden');
                qrBtn.className = "flex-1 py-2 text-sm font-medium rounded-lg bg-purple-600 text-white transition";
                pwdBtn.className = "flex-1 py-2 text-sm font-medium rounded-lg text-gray-400 transition";
            } else {
                qrSec.classList.add('hidden'); pwdSec.classList.remove('hidden');
                pwdBtn.className = "flex-1 py-2 text-sm font-medium rounded-lg bg-purple-600 text-white transition";
                qrBtn.className = "flex-1 py-2 text-sm font-medium rounded-lg text-gray-400 transition";
            }
        }

        function generateCustomQR() {
            const text = document.getElementById('qrInput').value;
            const fgColor = document.getElementById('qrColor').value;
            const bgColor = document.getElementById('qrBgColor').value;
            const logoInput = document.getElementById('qrLogo');
            const qrContainer = document.getElementById('qrcode');

            if(text.trim() === "") { alert("කරුණාකර අක්ෂරයක් හෝ ලිපිනයක් ඇතුළත් කරන්න!"); return; }
            qrContainer.innerHTML = "";
            qrContainer.classList.remove('hidden');

            let logoUrl = logoInput.files && logoInput.files[0] ? URL.createObjectURL(logoInput.files[0]) : "";
            const qrCode = new QRCodeStyling({
                width: 180, height: 180, data: text, image: logoUrl,
                dotsOptions: { color: fgColor, type: "rounded" },
                backgroundOptions: { color: bgColor },
                imageOptions: { crossOrigin: "anonymous", imageSize: 0.4, margin: 5 }
            });
            qrCode.append(qrContainer);
        }

        function generatePassword() {
            const chars = "0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ!@#$%^&*()_+";
            let password = "";
            for (let i = 0; i <= 12; i++) {
                password += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            document.getElementById('pwdOutput').value = password;
        }

        function copyPassword() {
            const pwdBox = document.getElementById('pwdOutput');
            if(!pwdBox.value) { alert("පළමුව Password එකක් Generate කරගන්න!"); return; }
            navigator.clipboard.writeText(pwdBox.value);
            alert("Password එක Copy කරගන්න ලදී!");
        }
    </script>
</body>
</html>
